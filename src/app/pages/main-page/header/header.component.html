<app-button-icon class="burger"><svg app-burger-icon></svg></app-button-icon>

<a href="#">
    <img src="logo.png" alt="logo">
</a>

<div class="menu">
    <app-menu>
        <app-menu-item [label]="'Ссылки'"><svg app-link-icon></svg></app-menu-item>
        <app-menu-item [label]="'Контакты'"><svg app-contacts-icon></svg></app-menu-item>
        <app-menu-item [label]="'Теги'"><svg app-tag-icon></svg></app-menu-item>
        <app-menu-item [label]="'Избранное'"><svg app-favorites-icon></svg></app-menu-item>
        <app-menu-item [label]="'Посещения'"><svg app-history-icon></svg></app-menu-item>
    </app-menu>

    <app-input-search
        [isActive]="isActiveSearch()"
        (searchButtonClick)="onSearchButtonClick()"
        (inputFocus)="onInputFocus()"
        (inputBlur)="onInputBlur()"
    />


    @if (isActiveFilter()) {
        <app-filters [checkboxGroups]="checkboxGroups">
            <app-history [historyItems]="searchHistoryList"></app-history>
        </app-filters>
    }
</div>

<app-button-icon class="add-button"><svg app-add-icon></svg></app-button-icon>


<div class="user-info">
    <app-header-notifications/>
    <img src="AVA.png" alt="avatar">
</div>

<div class="mobile-buttons-block">
    <app-button-icon><svg app-add-icon></svg></app-button-icon>
    <app-button-icon><svg app-history-icon></svg></app-button-icon>
    <app-input-search
        [isActive]="isActiveSearch()"
        (searchButtonClick)="onSearchButtonClick()"
        (inputFocus)="onInputFocus()"
        (inputBlur)="onInputBlur()"
    />

    @if (isActiveFilter()) {
        <app-filters [checkboxGroups]="checkboxGroups">
            <app-history [historyItems]="searchHistoryList"></app-history>
        </app-filters>
    }
    <app-header-notifications/>
</div>
